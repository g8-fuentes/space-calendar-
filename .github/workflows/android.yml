name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android
        run: bash tool/prepare_android.sh

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        run: flutter test

      - name: Gerar APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/divine-routine.apk

      - uses: actions/upload-artifact@v4
        with:
          name: divine-routine
          path: build/divine-routine.apk
