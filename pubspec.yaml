name: rotina_quest
description: Rotina Quest — a rotina semanal do Guilherme Fuentes como uma jornada espacial em pixel art.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf

# As versões novas destes plugins Android usam JNI, que quebrou no APK
# de release. As versões fixadas abaixo usam canal de plataforma.
dependency_overrides:
  shared_preferences_android: 2.4.28
  path_provider_android: 2.2.23
