name: rotina_quest
description: Rotina Quest — a rotina semanal do Guilherme Fuentes como uma jornada espacial em pixel art.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf

# A versão 2.5.x do plugin Android usa JNI e quebra no APK de release
# (o R8 remove os métodos que ele chama). A 2.4.x usa canal de plataforma.
dependency_overrides:
  shared_preferences_android: 2.4.28
