name: rotina_quest
description: Divine Routine — a rotina semanal do Guilherme Fuentes como uma jornada de fé em pixel art.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800

# As versões novas destes plugins Android usam JNI, que quebrou no APK
# de release. As versões fixadas abaixo usam canal de plataforma.
dependency_overrides:
  shared_preferences_android: 2.4.28
  path_provider_android: 2.2.23
